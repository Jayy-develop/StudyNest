services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: studynest-postgres
    environment:
      POSTGRES_DB: studynest_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev_password
    ports:
      - "5432:5432"
    volumes:
      - studynest_pgdata:/var/lib/postgresql/data

volumes:
  studynest_pgdata:
